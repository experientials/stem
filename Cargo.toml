# Virtual workspace root for the stem repo. Scoped (for now) to the HOST-BUILDABLE capability/contract
# crates — so `cargo test` runs them on the dev host and they share one resolver + target/.
#
# The FIRMWARE crates (bsp, deepsleep, prod, diag, the PACs, modules/pico-probe, examples) are EXCLUDED,
# NOT members: each builds standalone via its own toolchain (MSP430 → Docker msp430-gcc; pico-probe →
# thumbv6m host cargo) with its own target/. Excluding them means adding this root does NOT relocate their
# outputs or change their feature resolution — the `just build …` recipes + size-gate are untouched.
# They move into the workspace later, once the build recipes/size-gate point at a unified target/ (a
# separate, deliberate step — see STEM-DIRECTION "Repo layout").
[workspace]
resolver = "2"
members = [
    "crates/stembus",   # the Stem-bus contract + command vocabulary (host-tested)
    "crates/node-hal",  # host-clean hardware-seam traits
    "crates/devices",   # per-sensor drivers, generic over embedded-hal
    "crates/sched",     # the cooperative executor
]
exclude = [
    "crates/bsp",       # MSP430 PACs/board/hal — target-only
    "crates/deepsleep", # still deps msp430 (until 6e) — target-only
    "prod",             # MSP430 product binary (Docker build)
    "diag",             # MSP430 diag binary (Docker build)
    "pac",              # generated svd2rust PACs — target-only
    "pac/msp430fr2xxx-dual", # combined FR2476/FR2355/FR2155 PAC (dual-slot __INTERRUPTS, B1X/B1Y) — target-only
    "modules",          # pico-probe (thumbv6m, own toolchain) + future product modules
    "examples",         # MSP430 examples
    "spike/combined-mech", # SPIKE: dual-slot __INTERRUPTS + runtime eUSCI_B1 base/pins (MSP430, Docker build)
]
