name: firmware

# Build-only CI: compile the C and Rust firmware in the pinned toolchain image
# and upload the binaries. No hardware / flashing (that's local, via the
# msp430-macos-dev skill's mspdebug wrapper).
#
# Requires the toolchain-image workflow to have pushed the image to GHCR first.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest              # x86_64 runner → image runs native (no emulation)
    container:
      image: ghcr.io/${{ github.repository_owner }}/msp430-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Build examples (same just recipe as local dev)
        run: just examples       # inside the container → detects /.dockerenv → builds natively

      - name: Build diag (FR2476) — gated at 32 KB FRAM / 8 KB SRAM
        run: just diag build     # size-check.sh fails the job on overflow

      # prod is the DUAL-I²C family axis — build and gate the dev default. `just prod build` emits a
      # variant-unique artifact `prod-<family>` (cargo's shared `prod` path is still clobbered per
      # build, but the suffixed copy is stable), so no hand-copy is needed here.
      - name: Build prod fr247x (FR2476/FR2475 dual-I²C) — gated 32 KB / 8 KB
        run: just prod build fr247x

      # FR2433 single-I²C node is its own binary crate now (modules/expander, cros_ec-only). Route via
      # the chip-first frontend so it builds modules/expander and gates at 15 KB / 4 KB.
      - name: Build expander fr2433 (FR2433 single-I²C, cros_ec) — gated 15 KB / 4 KB
        run: just build fr2433

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            examples/hello-c/build/*.elf
            examples/hello-rust/target/msp430-none-elf/release/hello-rust
            diag/target/msp430-none-elf/release/diag
            prod/target/msp430-none-elf/release/prod-fr247x
            modules/expander/target/msp430-none-elf/release/expander-cros_ec
          if-no-files-found: error
