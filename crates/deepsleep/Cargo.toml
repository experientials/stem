[package]
name = "deepsleep"
version = "0.1.0"
edition = "2021"
description = "bob-929 MSP430 deepsleep-supervisor module — the capability crate both prod (API/event-loop harness) and diag (test harness) build on. Extracted from the prod binary per docs/DEEPSLEEP-EXTRACTION.md."
license = "MIT OR Apache-2.0"

[dependencies]
# The Stem-bus wire vocabulary (regmap addresses/codes, role/crc). The register-map decode here
# re-exports + extends it.
stembus = { path = "../stembus" }
# MSP430 hw (PAC alias, board semantic map, hal I2c seam, Leaf-I2C driver, fmt). The chip feature
# forwards to bsp (below), which owns the PAC alias; `enumerate` drives `bsp::{i2c,hal}` + `bsp::fmt`.
bsp = { path = "../bsp" }
# Shared per-sensor drivers (the `devices` convention) — `enumerate` probes/identifies through them.
devices = { path = "../devices" }
# The cooperative/async executor (ADR-0013): `enumerate`'s async scan `.await`s `sched::yield_now`.
sched = { path = "../sched" }
# For `msp430::asm::nop()` in the (--debug) VL53L0X ranging pacing loop.
msp430 = "0.4"

[features]
# Chip select — forwarded by the consumer; each enables the matching bsp PAC (bsp owns the alias +
# board/hal/i2c). bsp's dual PACs also turn on bsp/_leaf (the Leaf-master bus enumerate needs).
fr2476 = ["bsp/fr2476"]
fr2355 = ["bsp/fr2355"]
fr2155 = ["bsp/fr2155"]
fr2433 = ["bsp/fr2433"]
# Dual-I²C marker — gates the Leaf-master sensing code (`enumerate`). fr2433 is slave-only → never set.
_dual = []
# `console` = UART report paths; `debug` = the extra wake-on-approach ranging demo (implies console).
console = []
debug = ["console"]
# `cros_ec` = the cros_ec v3 EC-slave framing path (COMMANDS.md §0 HELLO milestone) — adds `ec` (glue to
# stembus::cros_ec::EcSlave) + `node` (the Node/Operate adapter) and enables the postcard command codec in
# stembus (vendor+postcard path). Opt-in; the consumer runs it INSTEAD of the regmap slave on FR2433.
cros_ec = ["stembus/postcard"]
# Operating modes (gate the `Mode` enum variants + their acquire/release actions) — forwarded by the
# consumer. `mode-sensing` needs the Leaf master (dual only); `mode-passive` is the off-the-bus state.
mode-passive = []
mode-sensing = []
