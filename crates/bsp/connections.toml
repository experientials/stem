[[connection]]
id       = "s1_button"
signal   = "S1 user button (diag skip / mode-cycle)"
pin      = "P4.0"
function = "GPIO"
module   = "PORT"
sel      = "none"
dir      = "in"
status   = "reserved"
net      = "P4.0_S1 — active-low, 47 kohm external pull-up to 3V3 (FR2476 LaunchPad)."
notes    = "FR2476 LaunchPad user button, authoritative per SLAU802 Fig. 19 'Pushbuttons' (S1=P4.0; S2=P2.3 unused; S3=RST). ALL boards have a button, so this is a general node input (press within the ~2 s --diag boot window = radio-free skip of the extended POST). RESERVED (not yet wired in firmware): the re-home from diag/src/buttons.rs is PARKED on a reset bug — reading P4.0 in the deepsleep boot-window loop reset-loops the node (standalone diag read it fine), root-cause TBD on the bench (SYSRSTIV/boot-reason + pin probing). See modules/deepsleep/DESIGN.md 'PARKED — radar + button'. Other boards' button pins need allocation via the pinmux model (FR2355/FR2155 unknown)."
