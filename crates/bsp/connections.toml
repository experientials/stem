# MSP430FR2476 connection registry (bob-929) — single source of truth.
#
# Every signal wired to the MCU is listed here. Add ONE connection at a time:
# set status = "active" only after the pin<->function pairing is verified against
# the FR2476 datasheet port-function table (datasheets/msp430fr2476.pdf).
#
# Intended consumers (codegen/validation, added later):
#   - diag/src/board.h        (C #defines)
#   - board crate bsp_pins!   (Rust typestate pins)
#   - a validator that checks each `function` is actually offered by `pin` on this chip
#
# Field vocabulary:
#   status : active | planned | reserved
#   dir    : in | out | bidir | analog
#   sel    : primary pin-mux select for the function (SEL0 = primary module function)

[chip]
part      = "MSP430FR2476"
# NOTE: "RHB VQFN-40" was inconsistent — per the datasheet (§ package options) RHB is the **32-pin**
# VQFN; the **40-pin** VQFN is **RHA** (48-pin is PT/LQFP). Confirm the actual package on the bench
# unit and set this to one of: "PT LQFP-48" | "RHA VQFN-40" | "RHB VQFN-32".
package   = "RHA VQFN-40?"          # PROVISIONAL — confirm against the unit on the bench
datasheet = "datasheets/msp430fr2476.pdf"

# ---------------------------------------------------------------------------
# BUSES — the MCU's I2C buses and their master/slave roles (doc-generation source).
# The MSP is on EXACTLY these two I2C buses and NOTHING else (never SYS_I2C / the PMIC bus;
# those are SoM-side). `scripts/gen-bsp-docs.py` renders these + per-bus pin membership
# (matched by `module`) into crates/bsp/generated/. Keep role facts HERE, not in prose docs.
#   role : master | slave | master-switch
# ---------------------------------------------------------------------------

[[bus]]
id     = "sensor"
name   = "Sensor I2C"
module = "eUSCI_B0"
role   = "master-switch"
desc   = "MSP MASTERS it in Sensing mode; RELEASES it so the SoM masters it in Passive mode."

[[bus]]
id     = "stem"
name   = "Stem I2C"
module = "eUSCI_B1"
role   = "slave"
desc   = "MSP is ALWAYS the slave; the SoM (RT core) or the RP2040 always masters it."

# ---------------------------------------------------------------------------
# ACTIVE — implemented in the diag firmware today (LEDs + backchannel)
# ---------------------------------------------------------------------------

[[connection]]
id       = "i2c_sda"
signal   = "Sensor/LED I2C SDA"
pin      = "P1.2"
function = "UCB0SDA"
module   = "eUSCI_B0"
sel      = "SEL0"
dir      = "bidir"
status   = "active"
net      = "IS31FL3730 @0x61 + APDS-9960 @0x39 + MC6470 eCompass @0x4C(accel)/0x0C(mag) (shared sensor bus)"
notes    = "verified against datasheet pin table"

[[connection]]
id       = "i2c_scl"
signal   = "Sensor/LED I2C SCL"
pin      = "P1.3"
function = "UCB0SCL"
module   = "eUSCI_B0"
sel      = "SEL0"
dir      = "bidir"
status   = "active"
net      = "IS31FL3730 @0x61 + APDS-9960 @0x39 + MC6470 eCompass @0x4C(accel)/0x0C(mag) (shared sensor bus)"
notes    = "verified against datasheet pin table"

[[connection]]
id       = "is31_sdb"
signal   = "IS31FL3730 SDB (shutdown, active-low)"
pin      = "P2.5"
function = "GPIO"
module   = "PORT"
sel      = "none"
dir      = "out"
status   = "active"
net      = "IS31FL3730 SDB — drive HIGH to enable (examples/i2c-is31)"
notes    = "Free header GPIO (UCA1RXD alt, unused). NOT P2.0 — that's crystal XOUT per slau802 fig 18. R3 (100k) pulls SDB LOW = shutdown by default (EB schematic Fig. 2), so driving HIGH is REQUIRED to enable the driver — must be wired P2.5 -> TP3 SDB."

[[connection]]
id       = "rcwl_out"
signal   = "RCWL-0516 microwave radar motion OUT"
pin      = "P2.4"
function = "GPIO"
module   = "PORT"
sel      = "none"
dir      = "in"
status   = "active"
net      = "RCWL-0516 OUT -> 2 kohm series -> P2.4. Digital: idles LOW, push-pull HIGH (~3.3 V) ~2 s per trigger, retriggerable. Sensor VIN=5 V, GND shared; 3V3 (regulator tap, an OUTPUT) and CDS pins left open."
notes    = "Bench wiring on the FR2476 LaunchPad (Henrik, 2026-08-31). Datasheet: P2.4 = general-purpose I/O with port interrupt + wake-from-LPMx.5 (only alt fn UCA1CLK, unused), so it keeps a future wake-on-motion path — chosen over P1.6 precisely to avoid the VSOM ADC pin (vsom_adc). Configured as GPIO input + pulldown in diag/src/main.rs; read in diag/src/rcwl.rs. 2 kohm series resistor in the OUT line caps any fault current (accidental output contention, or radar back-driving an unpowered MCU through the ESD clamp) at ~1.65 mA, under the ±2 mA per-pin clamp-diode limit; high level still ~3.0-3.1 V at the pin after the divider with the internal pulldown, well above V_IH."

[[connection]]
id       = "uart_tx"
signal   = "Backchannel UART TX"
pin      = "P1.4"
function = "UCA0TXD"
module   = "eUSCI_A0"
sel      = "SEL0"
dir      = "out"
status   = "active"
net      = "eZ-FET -> /dev/cu.usbmodem* (9600 8N1)"
notes    = "verified against datasheet pin table"

[[connection]]
id       = "uart_rx"
signal   = "Backchannel UART RX"
pin      = "P1.5"
function = "UCA0RXD"
module   = "eUSCI_A0"
sel      = "SEL0"
dir      = "in"
status   = "active"
net      = "eZ-FET backchannel"
notes    = "verified against datasheet pin table"

