[[connection]]
id       = "stem_sda"
signal   = "Stem I2C SDA (MCU = SLAVE; SoM/RP2040 masters)"
pin      = "P3.2"
function = "UCB1SDA"
module   = "eUSCI_B1"
sel      = "SEL0"
dir      = "bidir"
status   = "planned"
net      = "Stem bus to SoM/other MCUs — the PCA9698 register + debug surface (prod/src/regmap.rs)"
notes    = "PINS CONFIRMED against datasheet (P3.2 = UCB1SIMO/UCB1SDA), present on the 48/40/32-pin tables. Alternate mux: P4.4 = UCB1SDA. Shares the pin with UCB1SIMO (SPI) — mutually exclusive. Verify P3.2 is broken out to a header on the LaunchPad before bench-wiring."

[[connection]]
id       = "stem_scl"
signal   = "Stem I2C SCL (MCU = SLAVE)"
pin      = "P3.6"
function = "UCB1SCL"
module   = "eUSCI_B1"
sel      = "SEL0"
dir      = "bidir"
status   = "planned"
net      = "Stem bus"
notes    = "PINS CONFIRMED against datasheet (P3.6 = UCB1SOMI/UCB1SCL). Alternate mux: P4.3 = UCB1SCL. Shares the pin with UCB1SOMI (SPI). Verify P3.6 header availability on the LaunchPad."

[[connection]]
id       = "stem_msg"
signal   = "Stem MSG (1-Wire-over-UART)"
pin      = "P5.1/P5.2?"
function = "UCA0RXD/UCA0TXD"
module   = "eUSCI_A0"
dir      = "bidir"
status   = "planned"
net      = "shared 1-wire coordination line"
conflict = "uart_tx,uart_rx"       # same eUSCI_A0 — mutually exclusive with the diag backchannel
notes    = "product routes A0 to P5.1/P5.2; diag routes A0 to P1.4/P1.5. Only one at a time."

[[connection]]
id       = "sensor_int"
signal   = "Sensor interrupt in"
pin      = "TBD"
function = "GPIO"
module   = "PORT"
dir      = "in"
status   = "planned"
net      = "sensor INT (e.g. APDS-9960 / IMU)"
notes    = "assign a port pin with interrupt capability"

[[connection]]
id       = "som_wake"
signal   = "SoM wake — PMIC_ON_REQ OP-bank bit (the MSP IS the I/O expander)"
pin      = "TBD"
function = "GPIO"
module   = "PORT"
dir      = "out"
status   = "planned"
net      = "MSP GPIO / regmap OP-bank bit → PCA9450 PMIC_ON_REQ (assert HIGH to power-on the SoM). MSP replaces the old PCA9555/FR2032 expanders."
notes    = "Design per NXP PCA9450DS.pdf rev 2.2 (source of truth), NOT the outdated carrier wiring — see prod/DESIGN.md 'How the wake is hooked up'. PMIC_ON_REQ is a 1.8 V SNVS digital input: assert HIGH and HOLD it longer than tON_DEB (programmable debounce, PWR_CTRL) — a held LEVEL, not a pulse; masked until RTC_RESET_B released (~40 ms after cold VSYS). The MSP's ~3.3 V I/O must drive it OPEN-DRAIN to NVCC_SNVS (1.8 V) or via a level translator — never push-pull 3.3 V into the 1.8 V input. Companions (also OP bits): PMIC_STBY_REQ (standby), SYS_RST_PMIC (reset); POR_B = an IP-bank input. Pick an open-drain-capable port pin. Handshake: SOUND_INT (P20.12)=SoM→MSP 'M7 suspended' cue to enter Sensing; STEM_INT (P20.14)=MSP→SoM notify."

