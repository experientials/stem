# COMBINED PAC for the dual-I²C supervisor family FR2476/FR2355/FR2155 — ONE image, runtime model-select;
# see docs/spikes/combined-image.md. HAND-MAINTAINED (NOT regenerated by scripts/gen-pac.sh): based on a
# copy of pac/msp430fr2476 (the register superset — every firmware-used peripheral at the shared addresses
# plus the e_usci_b1::RegisterBlock + the Vector type), with two deliberate edits applied by hand to the
# generated lib.rs:
#   1. ADD `EUsciB1Y` (= e_usci_b1::RegisterBlock @ 0x05C0, the FR2355/FR2155 base) alongside the existing
#      `EUsciB1` (B1X @ 0x0580, the FR2476 base); both share the identical e_usci_b1 module.
#   2. DUAL-SLOT `__INTERRUPTS`: idx 47 (0xFFDE) now dispatches to EUSCI_B1 (not EUSCI_A1), so the SAME
#      EUSCI_B1 handler sits at BOTH 0xFFDA (FR2476) and 0xFFDE (FR2355/FR2155). The firmware uses only
#      eUSCI_B1, so there is no conflict. Everything else is the FR2476 superset (VECTORS 0xFF80/0x80).
[package]
name = "msp430fr2xxx-dual"
version = "0.1.0"
edition = "2021"
description = "Combined PAC for the dual-I²C supervisor family FR2476/FR2355/FR2155 — one image, runtime model-select (see docs/spikes/combined-image.md)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/experientials/stem"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["msp430", "pac", "svd2rust"]

[dependencies]
vcell = "0.1.3"
critical-section = { version = "1.1", optional = true }
msp430 = { version = "0.4.0", optional = true }
msp430-rt = { version = "0.4.0", optional = true }

[features]
default = []
rt = ["dep:msp430-rt"]
critical-section = ["dep:critical-section", "dep:msp430"]

[package.metadata.docs.rs]
features = ["rt", "critical-section"]
