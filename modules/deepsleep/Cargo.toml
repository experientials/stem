[package]
name = "deepsleep"
version = "0.1.0"
edition = "2021"
description = "bob-929 deepsleep sleep-supervisor PRODUCT (modules/deepsleep): the dual-I²C Stembus node that sleeps in LPM, serves its Stem control surface (stem-node), and in Sensing acquires the Leaf sensor bus (leaf-scan). Family axis: FR247x/FR215x/FR235x + the combined fr2xxx single image. (`deepsleep` names a MODULE/product, not a capability crate — the shared runtime is `stem-node`.)"

# COMPILE-TIME FAMILY AXIS (one image per register/memory-compatible DUAL-I²C family — see DESIGN.md).
# Exactly one family feature is active; it selects the PAC + memory map (build.rs) + gate budget
# (prod.just). This is how BOTH production families stay first-class — `fr247x` is just the default
# (the on-hand dev boards), NOT the only supported target.
# NOTE (STEM-DIRECTION Repo-layout reorg S2a): the FR2433 single-I²C slave-only node was EXTRACTED from
# here into its own binary crate `modules/expander/` (cros_ec-only). prod/ is now dual-I²C only.
[features]
default = ["fr247x", "console", "mode-passive", "mode-sensing"]
# DUAL-I²C families (2× eUSCI_B → Stem SLAVE + local sensor MASTER) all enable the internal `_dual`
# marker + select their PAC; they SHARE the code via the `pac` alias in main.rs. Adding one is just a
# feature line + optional PAC dep + a `pac` alias arm + the model/prod.just entries.
# The family feature forwards to bsp's PAC feature (bsp owns the PAC alias + the shared board/hal/i2c).
# Each family enables `bsp/rt` + `msp430-rt/device` → the device vector table for the eUSCI_B slave wake
# ISR (deepsleep LPM). diag does NOT (no ISRs), so bsp's chip features stay rt-free for the shared build.
fr247x = ["bsp/fr2476", "stem-node/fr2476", "_dual", "bsp/rt", "msp430-rt/device"] # FR2476/FR2475 — primary dev target
fr215x = ["bsp/fr2155", "stem-node/fr2155", "_dual", "bsp/rt", "msp430-rt/device"] # FR2155 — production dual-I²C baseline
fr235x = ["bsp/fr2355", "stem-node/fr2355", "_dual", "bsp/rt", "msp430-rt/device"] # FR2355 — dev LaunchPad, superset of FR2155
# fr2xxx = the COMBINED single image: ONE binary for FR2476 + FR2355/FR2155 (S2b). Selects the combined
# `bsp/fr2xxx` PAC (runtime eUSCI_B1 base/pins + runtime clock/console dispatch); NO `deepsleep/<chip>`
# marker (the per-chip console hints are runtime, deferred to the console follow-on) — just `_dual`. The
# combined PAC's rt table maps EUSCI_B1 at BOTH 0xFFDA and 0xFFDE, so the one image's wake ISR fires on
# either part. Build: `just build fr2xxx` (dark prod by default). HW-proven on @fr2476 AND @fr2355 (S2b.4).
fr2xxx = ["bsp/fr2xxx", "_dual", "bsp/rt", "msp430-rt/device"]
# (FR2433 single-I²C slave-only node REMOVED in S2a — it is now `modules/expander/`, a separate binary.)
# Internal marker: "this is a dual-I²C family" — gates the shared dual-I²C code; forwards to deepsleep's
# `_dual` so its `enumerate` module compiles. Not selected directly.
_dual = ["stem-node/_dual", "dep:leaf-scan"]
# The Stem (eUSCI_B1) slave pins are routed by `bsp::board::route_stem_i2c_pins`, keyed on the chip
# feature the board layer already carries (P3.2/3.6 FR2476, P4.6/4.7 FR2355/FR2155, P1.2/3 FR2433) —
# so no prod-level pin-group marker is needed (dropped in Phase 1a; was `_stem_p3`/`_stem_p4`).
# `console` — dev-only UART logging. Default (non-debug) = LEAN per DESIGN.md: version + per-sector FRAM
# checksums only. OFF = silent production image; state lives only in the debug registers / I2C-slave
# surface (smaller FRAM, no UART clocking). Orthogonal to the family axis. On by default for dev.
console = ["stem-node/console", "leaf-scan?/console"]
# `debug` — verbose build (implies console): adds the post-POST "what was found" (enumerate report +
# status dump + a Leaf/eUSCI diagnostic) and the interactive s/r/d/m/l commands. Built via
# `just build <chip> --debug`. "Not a full diag, but some basic info" (DESIGN.md, Henrik 2026-10-04).
debug = ["console", "stem-node/debug", "leaf-scan?/debug"]
# (The `cros_ec` feature was removed — cros_ec is the SOLE command interface now; the PCA9698-regmap slave
# is gone, COMMANDS.md §0. `stem-node`'s ec/node are always compiled; nothing to gate.)

# OPERATING MODES (see DESIGN.md "Operating modes"). A build compiles in the modes it supports; the
# active mode is a RUNTIME switch among them. At least ONE mode is required (compile_error guard).
# `mode-passive` — SoM masters; MSP is a pure I/O-extender on the B1 slave, never touches the sensor bus.
mode-passive = []
# `mode-sensing` — SoM suspended; MSP acquires the sensor bus (B0 master), monitors, wakes the PMIC.
# mode-passive/mode-sensing are now PRODUCT-LOCAL (the Passive↔Sensing machine `src/mode.rs` lives here,
# not in the shared runtime) — they gate `mode.rs`'s variants/actions, forwarded to nothing.
mode-sensing = []

[dependencies]
msp430 = "0.4"
msp430-rt = "0.4"
panic-msp430 = "0.4"
# The shared low-level layer: chip-select PAC alias, board semantic map, hal I2c seam, Leaf-I2C
# driver. prod re-exports bsp::{pac,hal,i2c} (main.rs); the family feature forwards to bsp (above).
bsp = { path = "../../crates/bsp" }
# Host-clean hardware-seam traits + `ChipId` (DEEPSLEEP-EXTRACTION.md Phase 6). The bin builds the `ChipId`
# once from the detected model and passes it to `stem_node::{post,status}` (which are PAC-free).
node-hal = { path = "../../crates/node-hal" }
sched = { path = "../../crates/sched" }
# The Stem-bus wire contract (regmap constants, cros_ec framing, mode codes) + shared codecs (FRAM CRC).
stembus = { path = "../../crates/stembus" }
# Shared per-device drivers (one module per sensor, standard Device convention) via the embedded-hal seam.
devices = { path = "../../crates/devices" }
# The shared Stembus-node control surface (cros_ec serve + dispatch, POST, status). This product drives it
# as the API/event loop. (Renamed from the product-named `deepsleep` capability crate — see git history.)
stem-node = { path = "../../crates/stem-node" }
# Leaf-I²C sensor enumeration — a dual-only capability (optional, pulled in by the `_dual` feature). Used
# by the Sensing-mode scan path; a slave-only node wouldn't link it.
leaf-scan = { path = "../../crates/leaf-scan", optional = true }

# opt-level "s" + LTO: size wins over speed (the FRAM budget is the point). The gate
# (`just prod build`) fails the build if the footprint exceeds the active family's budget.
[profile.release]
opt-level = "s"
lto = true
# Keep DWARF symbols: they land in non-loadable .debug_* sections, so they do NOT count against the
# FRAM/SRAM budget (size-check.sh measures loadable text/data/bss only) — free on-device. Gains
# addr2line on panic PCs, backtraces, and gdb-over-SBW source debugging. Only cost is a larger host ELF.
debug = true

# Fast-iteration profile: same size-opt, NO LTO, for a quicker edit→flash loop. Larger than
# release — may exceed the budget; that's expected. Ship only `release` (LTO), which the gate checks.
[profile.fast]
inherits = "release"
lto = false
