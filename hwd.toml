# thepia hwd board aliases — the fault-resistant identity map for the current bench.
#
# IDENTITY = two hardwired, firmware-independent facts:
#   • which board = the eZ-FET USB serial (below)   — from USB enumeration
#   • which chip  = the JTAG silicon device-id       — 0x0210 FR2476, 0x01ff FR2355, 0x01c6 FR2433
# Do NOT trust the "TI MSP430FR2476 LaunchPad" text hwd prints: it's the shared eZ-FET USB PID
# (2047:0013), identical across variants — not silicon. The JTAG device-id (halted, no firmware) is
# the authority. KNOWN DEFECT (C32): with >1 eZ-FET attached, live `msp identify`/flash routing
# collapses — chip-id is only trustworthy SINGLE-ADAPTER. The ids below were each read solo (2026-09-30).
# (Henrik has many boards; these are the 3 currently on the bench. Old toy-a/toy-b were other units.)
#
# NON-eZ-FET boards use a DIFFERENT identity. The RP2040 below is NOT an MSP430/eZ-FET board: it has no
# JTAG device-id and no eZ-FET. Its `serial` is the RP2040's **BOOTSEL USB serial = QSPI flash unique
# id** (the `picotool --ser` key). Loading is USB (picotool), not SBW — see docs/proposals/
# thepia-hwd-pico-support.md for the proposed `hwd rp2`/`pico` support.

[[board.alias]]
name = "fr2476"
serial = "0E5D41510A002800"   # MSP430FR2476, id 0x0210 (fr247x, dual-I²C dev). Console usbmodem233203.

[[board.alias]]
name = "fr2355"
serial = "8E57A36E1E000B00"   # MSP430FR2355, id 0x01ff (dual-I²C; the Detector/sensing dev part). Console usbmodem233303.

[[board.alias]]
name = "fr2433"
serial = "2FAFB46F29002500"   # MSP430FR2433, id 0x01c6 (fr24xx, single-I²C passive expander). Console usbmodem233103.

[[board.alias]]
name = "rp2040"
serial = "E0C9125B0D9B"        # RP2040 rev B2 — bench dev HOST / M7 stand-in. This is the BOOTSEL/`RP2
                               # Boot` USB serial = the `picotool --ser` key when flashing. NOT eZ-FET.
# IMPORTANT (found on bench 2026-09-30): the BOOTSEL serial DIFFERS from the running firmware's id.
# The stem-probe firmware reports the true 64-bit QSPI flash unique id as its USB iSerial:
#   flash_uid = "E6614C311B471322"   # what the OS/CDC sees while the app runs
# So the board key is MODE-DEPENDENT: picotool/BOOTSEL → E0C9125B0D9B; running/CDC → E6614C311B471322.
# hwd must map both to this one board (see docs/proposals/thepia-hwd-pico-support.md §3).
